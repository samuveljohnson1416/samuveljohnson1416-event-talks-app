<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigQuery Release Notes Radar</title>
  <meta name="description" content="Stay updated with the latest features, enhancements, and fixes in Google BigQuery. Select updates to Tweet.">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <!-- Decorative Glowing Background elements -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="logo-container">
          <!-- Database/BigQuery themed SVG icon -->
          <svg viewBox="0 0 24 24">
            <path d="M19 12v7c0 1.66-3.58 3-8 3s-8-1.34-8-3v-7c0 1.66 3.58 3 8 3s8-1.34 8-3zm0-5v3c0 1.66-3.58 3-8 3s-8-1.34-8-3V7c0 1.66 3.58 3 8 3s8-1.34 8-3zm-8-5c4.42 0 8 1.34 8 3s-3.58 3-8 3-8-1.34-8-3 3.58-3 8-3z"/>
          </svg>
        </div>
        <div class="title-area">
          <h1>BigQuery Release Notes Radar</h1>
          <p>Real-time updates & announcement tracker <span id="lastSynced" class="last-synced"></span></p>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggleBtn" class="btn-theme-toggle" aria-label="Toggle light/dark theme">
          <!-- Moon icon (shows in light mode) -->
          <svg class="icon-moon" viewBox="0 0 24 24">
            <path d="M12.3 22h-.1c-5.5 0-10-4.5-10-10C2.2 6.8 6.4 2.5 11.7 2.1c.5 0 .9.3 1 .8s-.1.9-.6 1.2c-3.7 2.1-5.1 6.8-3 10.5 1.7 2.9 4.8 4.5 8 4.5 1.2 0 2.4-.3 3.5-.9.4-.2.9-.2 1.2.1.3.3.4.8.2 1.2-1.9 2.5-4.8 4.1-7.7 4.1zm-1.8-17.9c-3.8.7-6.5 4-6.5 7.9 0 4.4 3.6 8 8 8 2.2 0 4.3-.9 5.8-2.5-4.5.3-8.3-3-8.6-7.5-.2-2.1.6-4.2 1.3-5.9z"/>
          </svg>
          <!-- Sun icon (shows in dark mode) -->
          <svg class="icon-sun" viewBox="0 0 24 24">
            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm-12.37 1.41a.996.996 0 0 0 1.41 0 .996.996 0 0 0 0-1.41l-1.06-1.06c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06zm12.37-13.78a.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06a.996.996 0 0 0 0-1.41z"/>
          </svg>
        </button>

        <button id="refreshBtn" class="btn-refresh" aria-label="Refresh release notes">
          <svg viewBox="0 0 24 24">
            <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
          <span>Refresh</span>
        </button>
      </div>
    </header>

    <!-- Toolbar controls -->
    <div class="toolbar">
      <div class="search-wrapper">
        <svg viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search release notes by keywords...">
      </div>

      <div class="filter-tags" id="categoryFilters">
        <button class="tag-btn active" data-filter="All">All Updates</button>
        <button class="tag-btn" data-filter="Feature">Features</button>
        <button class="tag-btn" data-filter="Announcement">Announcements</button>
        <button class="tag-btn" data-filter="Issue">Issues</button>
        <button class="tag-btn" data-filter="Deprecation">Deprecations</button>
      </div>

      <button id="exportCsvBtn" class="btn-export" aria-label="Export filtered release notes to CSV">
        <svg viewBox="0 0 24 24">
          <path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/>
        </svg>
        <span>Export CSV</span>
      </button>
    </div>

    <!-- Feed Container -->
    <div id="feed" class="feed-container">
      <!-- Skeleton Loaders -->
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>

  <!-- Floating Bar for Multi-selection Tweets -->
  <div id="floatingBar" class="floating-bar">
    <div class="selection-info">
      <span id="selectedCount">0</span> updates selected
    </div>
    <div class="floating-actions">
      <button id="tweetSelectedBtn" class="btn-floating-tweet">
        <!-- Twitter/X logo SVG -->
        <svg viewBox="0 0 24 24">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        Tweet Selected
      </button>
      <button id="clearSelectionBtn" class="btn-clear-selection">Clear</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
